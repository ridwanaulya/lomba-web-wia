<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Bright Clean Sky -->
    <linearGradient id="skyPed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <!-- Modern Granite Paver Base -->
    <linearGradient id="granitePaver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Yellow Tactile Block (Guiding Tiles) -->
    <linearGradient id="tactileYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Clear Bright Day -->
  <rect width="800" height="240" fill="url(#skyPed)"/>
  
  <!-- Modern Storefront / Commercial Street Building -->
  <rect x="520" y="30" width="280" height="210" fill="#334155"/>
  <rect x="540" y="50" width="45" height="70" fill="#38bdf8" opacity="0.6"/>
  <rect x="605" y="50" width="45" height="70" fill="#38bdf8" opacity="0.6"/>
  <rect x="670" y="50" width="45" height="70" fill="#38bdf8" opacity="0.6"/>
  <rect x="735" y="50" width="45" height="70" fill="#38bdf8" opacity="0.6"/>
  <!-- Modern Clean Glass Entrance Canopy -->
  <polygon points="510,150 800,150 800,165 510,165" fill="#0284c7" opacity="0.8"/>

  <!-- Clean Asphalt Roadway on the Left -->
  <polygon points="0,240 220,240 100,600 0,600" fill="#0f172a"/>
  <!-- White Edge Road Marking -->
  <polygon points="210,240 216,240 96,600 90,600" fill="#ffffff" opacity="0.9"/>

  <!-- Pristine Granite Curb (Batas Trotoar Presisi) -->
  <polygon points="220,240 250,240 140,600 100,600" fill="#64748b"/>
  <line x1="220" y1="240" x2="100" y2="600" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="250" y1="240" x2="140" y2="600" stroke="#334155" stroke-width="2"/>

  <!-- Brand New Wide Sidewalk Surface (Ubin Granit Modern) -->
  <polygon points="250,240 800,240 800,600 140,600" fill="url(#granitePaver)"/>

  <!-- Perfectly Aligned Modular Grid Lines (Paving Block Presisi) -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <!-- Horizontal paver lines in perspective -->
    <line x1="246" y1="260" x2="800" y2="260"/>
    <line x1="240" y1="285" x2="800" y2="285"/>
    <line x1="232" y1="315" x2="800" y2="315"/>
    <line x1="222" y1="350" x2="800" y2="350"/>
    <line x1="208" y1="395" x2="800" y2="395"/>
    <line x1="192" y1="450" x2="800" y2="450"/>
    <line x1="170" y1="515" x2="800" y2="515"/>
    <line x1="140" y1="600" x2="800" y2="600"/>

    <!-- Vertical perspective joint lines -->
    <line x1="310" y1="240" x2="220" y2="600"/>
    <line x1="390" y1="240" x2="330" y2="600"/>
    <line x1="480" y1="240" x2="450" y2="600"/>
    <line x1="580" y1="240" x2="580" y2="600"/>
    <line x1="680" y1="240" x2="710" y2="600"/>
  </g>

  <!-- BRIGHT YELLOW TACTILE GUIDING BLOCKS (Jalur Pemandu Disabilitas Baru) -->
  <!-- Continuous yellow stripe in perspective -->
  <polygon points="415,240 455,240 425,600 375,600" fill="url(#tactileYellow)" stroke="#ca8a04" stroke-width="2"/>
  <!-- Tactile Raised Directional Ribs (Garis Timbul Pemandu) -->
  <g stroke="#a16207" stroke-width="3" stroke-linecap="round">
    <line x1="428" y1="250" x2="426" y2="280"/>
    <line x1="438" y1="250" x2="436" y2="280"/>

    <line x1="424" y1="295" x2="421" y2="335"/>
    <line x1="437" y1="295" x2="434" y2="335"/>

    <line x1="418" y1="360" x2="414" y2="415"/>
    <line x1="434" y1="360" x2="430" y2="415"/>

    <line x1="410" y1="440" x2="404" y2="520"/>
    <line x1="428" y1="440" x2="422" y2="520"/>

    <line x1="400" y1="540" x2="394" y2="600"/>
    <line x1="420" y1="540" x2="414" y2="600"/>
  </g>

  <!-- Modern City Tree Pot (Pohon Peneduh Kota) -->
  <g transform="translate(620, 310)">
    <!-- Planter box -->
    <rect x="-30" y="30" width="60" height="20" rx="4" fill="#334155" stroke="#64748b"/>
    <!-- Tree Trunk -->
    <rect x="-6" y="-60" width="12" height="95" fill="#78350f" rx="3"/>
    <!-- Green Leaves -->
    <circle cx="0" cy="-80" r="45" fill="#15803d" opacity="0.95"/>
    <circle cx="-25" cy="-90" r="35" fill="#22c55e" opacity="0.9"/>
    <circle cx="25" cy="-90" r="35" fill="#16a34a" opacity="0.9"/>
    <circle cx="0" cy="-110" r="30" fill="#4ade80" opacity="0.9"/>
  </g>

  <!-- Wheelchair / Disability Accessibility Icon on Sidewalk -->
  <g transform="translate(260, 480)" fill="#0284c7">
    <circle cx="20" cy="10" r="6"/>
    <path d="M 18 18 L 18 35 L 30 35 L 30 46" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 28 26 A 12 12 0 1 1 12 38" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- OVERLAY BADGE (Editorial Civic Stamp - Selesai) -->
  <g transform="translate(24, 24)">
    <rect width="230" height="42" rx="8" fill="#065f46" fill-opacity="0.95" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="10" fill="#d1fae5"/>
    <!-- Checkmark icon -->
    <path d="M 19 21 L 22 24 L 29 17" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="44" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">KONDISI SESUDAH</text>
    <text x="44" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#a7f3d0">Trotoar Ramah Disabilitas 100%</text>
  </g>
</svg>
