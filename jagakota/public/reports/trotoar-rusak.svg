<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Sky & Urban Context -->
    <linearGradient id="skyCity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- Sidewalk Pavement Base -->
    <linearGradient id="pavementBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background Sky & Commercial Buildings -->
  <rect width="800" height="240" fill="url(#skyCity)"/>
  <!-- Commercial building facade on the right -->
  <rect x="520" y="40" width="280" height="200" fill="#475569" opacity="0.6"/>
  <rect x="540" y="60" width="40" height="60" fill="#e2e8f0" opacity="0.4"/>
  <rect x="600" y="60" width="40" height="60" fill="#e2e8f0" opacity="0.4"/>
  <rect x="660" y="60" width="40" height="60" fill="#e2e8f0" opacity="0.4"/>
  <rect x="720" y="60" width="40" height="60" fill="#e2e8f0" opacity="0.4"/>
  <!-- Road on the left -->
  <polygon points="0,240 220,240 100,600 0,600" fill="#1e293b"/>
  <!-- Curb -->
  <polygon points="220,240 250,240 140,600 100,600" fill="#94a3b8"/>

  <!-- Sidewalk Floor (Perspective) -->
  <polygon points="250,240 800,240 800,600 140,600" fill="url(#pavementBase)"/>

  <!-- Paving Block Grid Pattern (Uneven & Broken) -->
  <g stroke="#1e293b" stroke-width="2" fill="#64748b" opacity="0.7">
    <!-- Row 1 -->
    <polygon points="270,250 340,250 330,280 260,280"/>
    <polygon points="350,250 430,250 420,280 340,280"/>
    <polygon points="440,250 520,250 510,280 430,280"/>
    <polygon points="530,250 620,250 610,280 520,280"/>
    <polygon points="630,250 720,250 710,280 620,280"/>

    <!-- Row 2 -->
    <polygon points="255,290 325,290 310,330 240,330"/>
    <polygon points="335,290 415,290 400,330 320,330"/>
    <polygon points="425,290 505,290 490,330 410,330"/>
    <polygon points="515,290 605,290 590,330 500,330"/>
    <polygon points="615,290 705,290 690,330 600,330"/>

    <!-- Row 3 - Severe displacement -->
    <polygon points="230,345 305,340 280,395 205,395" fill="#475569"/>
    <polygon points="315,340 395,335 375,395 295,395" fill="#334155"/>
    <polygon points="405,335 485,340 470,395 390,395" fill="#475569"/>
    <polygon points="495,340 585,340 570,395 480,395" fill="#334155"/>

    <!-- Broken / Missing Paving Tiles Section (Ubin Ambles & Lepas) -->
    <polygon points="190,410 270,405 240,480 160,480" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <!-- Hole with dirt & rubble -->
    <path d="M 270 410 L 460 405 L 490 490 L 235 485 Z" fill="#0f172a" stroke="#020617" stroke-width="4"/>
  </g>

  <!-- Broken Chunks of Paver Stones Scattered -->
  <polygon points="280,430 330,415 340,445 290,455" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <polygon points="350,420 410,430 395,465 340,450" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
  <polygon points="320,455 380,450 375,480 315,485" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <polygon points="415,440 455,430 460,465 420,475" fill="#475569" stroke="#0f172a" stroke-width="2"/>

  <!-- Broken Tactile Yellow Block (Ubin Pemandu Rusak / Hilang) -->
  <polygon points="480,340 515,340 500,395 465,395" fill="#ca8a04" opacity="0.6"/>
  <!-- Broken tactile line -->
  <polygon points="460,410 495,410 440,480 405,480" fill="#eab308" opacity="0.4" stroke="#713f12" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- TRIP HAZARD WARNING ICON -->
  <g transform="translate(320, 480)">
    <!-- Warning Sign Mini -->
    <polygon points="30,0 60,50 0,50" fill="#eab308" stroke="#854d0e" stroke-width="3"/>
    <text x="30" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#713f12" text-anchor="middle">!</text>
  </g>

  <!-- Cracks on concrete -->
  <g stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 520 400 Q 560 440 600 450 T 680 480"/>
    <path d="M 580 445 Q 610 420 640 410"/>
    <path d="M 450 490 Q 480 540 520 580"/>
    <path d="M 230 490 Q 200 530 180 580"/>
  </g>

  <!-- OVERLAY BADGE -->
  <g transform="translate(24, 24)">
    <rect width="210" height="42" rx="8" fill="#991b1b" fill-opacity="0.95" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="10" fill="#fee2e2"/>
    <text x="24" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#991b1b" text-anchor="middle">!</text>
    <text x="44" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">KONDISI SEBELUM</text>
    <text x="44" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#fecaca">Trotoar Amblas &amp; Ubin Pecah</text>
  </g>
</svg>
